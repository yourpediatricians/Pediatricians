<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wepediatrics</title>
  </head>
  <body>
    <div id="root" class="d-flex flex-column"></div>
    <script type="module" src="/src/main.jsx"></script>
    <div class="form-container">
      <h2>Payment Form</h2>
      <form action="https://wepediatrics.com/payment/phonepe" method="POST">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="phone">Mobile Number</label>
          <input type="text" id="phone" name="phone" required />
        </div>
        <div class="form-group">
          <label for="by_amount">Amount</label>
          <input type="number" id="by_amount" name="by_amount" required />
        </div>
        <div class="form-group">
          <button type="submit">Pay Now</button>
        </div>
      </form>
    </div>
  </body>
</html>
